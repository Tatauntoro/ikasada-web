# docker-compose untuk deploy APLIKASI saja (database Postgres dikelola
# terpisah, tidak didefinisikan di sini). Set DATABASE_URL ke instance
# Postgres yang sudah kamu buat sendiri.
#
# Di Dokploy: isi semua env di bawah lewat panel "Environment" pada
# aplikasinya, atau siapkan file .env di sebelah file ini sebelum deploy.

services:
  # Jalan sekali tiap deploy: apply migration Prisma yang belum jalan
  # (`prisma migrate deploy`, non-interaktif & aman untuk incremental
  # migration), lalu exit. Service app baru start kalau ini sukses.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - dokploy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Contoh: postgresql://user:password@host:5432/ikasada
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    # Tidak publish port ke host: Traefik-nya Dokploy route langsung ke
    # container lewat dokploy-network (pakai port internal 3000 yang sudah
    # di-EXPOSE di Dockerfile). Publish ke host malah rawan bentrok "port is
    # already allocated" kalau ada app lain di server yang juga mau port 3000.
    expose:
      - "3000"
    volumes:
      # Fallback penyimpanan lokal (arsip, media galeri, gambar upload) —
      # dipakai kalau Cloudinary tidak dikonfigurasi. Kalau Cloudinary sudah
      # diisi, volume ini tidak akan terpakai.
      - app_storage:/app/storage
    networks:
      - dokploy-network

volumes:
  app_storage:

networks:
  # Network bawaan Dokploy (dibuat otomatis oleh Dokploy sendiri) — wajib
  # di-join supaya Traefik bisa route domain ke container ini. Kalau Postgres
  # kamu juga container di server yang sama dan ikut network ini, DATABASE_URL
  # bisa pakai nama service/container-nya langsung sebagai host.
  dokploy-network:
    external: true
